default:
  tags:
    - autoscale

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

stages:
  - format
  - test

Check Black format:
  stage: format
  only:
    - branches
  except:
    - tags
  script:
    - pip install black
    - black . --check --diff --color

Pytest:
  stage: test
  only:
    - branches
  except:
    - tags
  script:
    - pip install --upgrade pip
    - pip install pytest
    - pytest -vv
