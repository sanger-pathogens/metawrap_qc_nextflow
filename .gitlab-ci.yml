include:
  - project: "sanger-pathogens/templates/ci-templates"
    ref: "$CI_CD_TEMPLATES_LATEST_STABLE"
    file: "Pipelines/PaM-Info-Nextflow.gitlab-ci.yml"

pytest:
  extends: .before_build_job_template
  before_script:
    - pip install --upgrade pip
    - pip install pytest
  script:
    - pytest -vv

# Tell Talisman to ignore the git history (before introduction of .talismanrc / taslisman CI job)
# (as we are confident that previous warnings are not true positive security risks)
talisman:
  variables:
    TALISMAN_OPTS: "--scan --ignoreHistory"
